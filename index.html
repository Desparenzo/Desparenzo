
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fb">
  <meta name="description" content="Desparenzo Inc. app and game library.">
  <title>Desparenzo | App Library</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f4f5fa;
      --page-glow-a: rgba(125, 105, 255, .13);
      --page-glow-b: rgba(51, 185, 224, .10);
      --surface: rgba(255,255,255,.74);
      --surface-strong: rgba(255,255,255,.92);
      --surface-hover: rgba(255,255,255,.98);
      --ink: #171927;
      --muted: #74788b;
      --line: rgba(35,39,65,.09);
      --accent: #6457ed;
      --accent-soft: rgba(100,87,237,.11);
      --shadow: 0 12px 34px rgba(35,39,75,.07);
      --tile-shadow: 0 8px 22px rgba(35,39,75,.09);
      --header: rgba(247,248,252,.78);
      --focus: rgba(100,87,237,.48);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --page: #10121b;
      --page-glow-a: rgba(107,91,255,.17);
      --page-glow-b: rgba(28,171,216,.10);
      --surface: rgba(28,31,46,.76);
      --surface-strong: rgba(31,34,50,.94);
      --surface-hover: rgba(39,43,62,.98);
      --ink: #f3f4fb;
      --muted: #a1a5ba;
      --line: rgba(225,229,255,.10);
      --accent: #a69cff;
      --accent-soft: rgba(166,156,255,.14);
      --shadow: 0 14px 36px rgba(0,0,0,.20);
      --tile-shadow: 0 8px 24px rgba(0,0,0,.22);
      --header: rgba(16,18,27,.80);
      --focus: rgba(166,156,255,.58);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 150px; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(900px 520px at 0% -5%, var(--page-glow-a), transparent 66%),
        radial-gradient(720px 440px at 100% 14%, var(--page-glow-b), transparent 64%),
        var(--page);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      transition: background-color .25s ease, color .25s ease;
    }

    button, input { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }

    .top-shell {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: max(12px, env(safe-area-inset-top)) 18px 12px;
      background: var(--header);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(22px) saturate(1.35);
      -webkit-backdrop-filter: blur(22px) saturate(1.35);
    }

    .topbar {
      width: min(1160px, 100%);
      min-height: 48px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      color: #fff;
      font-size: 15px;
      font-weight: 850;
      letter-spacing: -1px;
      background: linear-gradient(140deg, #7867ff, #4b9fe8 95%);
      box-shadow: 0 7px 18px rgba(100,87,237,.25), inset 0 1px 0 rgba(255,255,255,.35);
    }

    .brand-copy { min-width: 0; }
    .brand-name {
      display: block;
      overflow: hidden;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 820;
      letter-spacing: -.45px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .brand-subtitle {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 1.45px;
      text-transform: uppercase;
    }

    .top-actions { display: flex; align-items: center; gap: 8px; }
    .icon-action {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface);
      box-shadow: 0 4px 13px rgba(30,35,70,.035);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .icon-action:hover { background: var(--surface-hover); border-color: var(--focus); }
    .icon-action:active { transform: scale(.94); }
    .icon-action svg { width: 19px; height: 19px; stroke: currentColor; }

    .search-row {
      width: min(1160px, 100%);
      margin: 10px auto 0;
      display: none;
    }
    .search-row.open { display: block; animation: reveal .18s ease-out; }
    .search-wrap { position: relative; }
    .search-wrap svg {
      position: absolute;
      top: 50%;
      left: 15px;
      width: 18px;
      height: 18px;
      color: var(--muted);
      transform: translateY(-50%);
      pointer-events: none;
    }
    #search-input {
      width: 100%;
      height: 46px;
      padding: 0 15px 0 43px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 15px;
      outline: none;
      background: var(--surface-strong);
      box-shadow: var(--shadow);
    }
    #search-input:focus { border-color: var(--focus); box-shadow: 0 0 0 3px var(--accent-soft); }
    #search-input::placeholder { color: var(--muted); }

    .category-nav {
      width: min(1160px, 100%);
      margin: 11px auto 0;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 1px 1px 2px;
      scrollbar-width: none;
    }
    .category-nav::-webkit-scrollbar { display: none; }
    .category-chip {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface);
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color .18s ease, background .18s ease, border-color .18s ease;
    }
    .category-chip:hover, .category-chip.active {
      color: var(--accent);
      border-color: transparent;
      background: var(--accent-soft);
    }

    .download-app-link {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--accent);
      background: var(--surface);
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color .18s ease, background .18s ease, border-color .18s ease;
    }
    .download-app-link:hover {
      border-color: transparent;
      background: var(--accent-soft);
    }

    main {
      width: min(1160px, 100%);
      margin: 0 auto;
      padding: 28px 22px 52px;
    }

    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
    }
    .eyebrow {
      margin: 0 0 7px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 1.9px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 34px);
      line-height: 1.1;
      font-weight: 850;
      letter-spacing: -1.3px;
    }
    .intro-note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .library-count {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-align: right;
      padding-bottom: 3px;
    }

    .library-section { margin: 0 0 34px; scroll-margin-top: 158px; }
    .section-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 15px;
    }
    .section-heading h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 820;
      letter-spacing: -.35px;
    }
    .section-count {
      min-width: 23px;
      height: 22px;
      padding: 0 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: 10px;
      font-weight: 800;
    }
    .section-rule { height: 1px; flex: 1; background: var(--line); margin-left: 4px; }

    .search-results-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: -7px 5px 22px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface);
      box-shadow: 0 5px 18px rgba(35,39,75,.035);
    }
    .search-results-bar[hidden] { display: none; }
    .search-results-title {
      min-width: 0;
      color: var(--ink);
      font-size: 13px;
      font-weight: 780;
      overflow-wrap: anywhere;
    }
    .search-results-count {
      flex: 0 0 auto;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 15px 12px;
    }
    .app-tile-wrap {
      position: relative;
      min-width: 0;
    }
    .app-tile {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      padding: 9px 5px 10px;
      border: 1px solid transparent;
      border-radius: 19px;
      text-align: center;
      text-decoration: none;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
      outline: none;
    }
    .app-tile:hover, .app-tile:focus-visible {
      background: var(--surface);
      border-color: var(--line);
      transform: translateY(-3px);
    }
    .app-tile:active { transform: scale(.96); }
    .app-icon {
      position: relative;
      width: 68px;
      height: 68px;
      overflow: hidden;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 21px;
      color: #fff;
      font-size: 21px;
      font-weight: 850;
      letter-spacing: -.8px;
      box-shadow: var(--tile-shadow), inset 0 1px 0 rgba(255,255,255,.26);
      background: linear-gradient(145deg, var(--icon-a), var(--icon-b));
      isolation: isolate;
    }
    .app-icon::before {
      content: "";
      position: absolute;
      width: 52px;
      height: 52px;
      top: -28px;
      right: -13px;
      border-radius: 50%;
      background: rgba(255,255,255,.19);
      filter: blur(1px);
      z-index: -1;
    }
    .app-icon img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: inherit;
    }

    /* Pin / Unpin appears only after a long press. */
    .pin-menu {
      position: absolute;
      z-index: 5;
      top: 1px;
      right: 1px;
      min-height: 31px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: var(--surface-strong);
      box-shadow: 0 5px 16px rgba(20,24,50,.17);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .pin-menu[hidden] { display: none; }
    .pin-menu:not([hidden]) { display: inline-flex; align-items: center; justify-content: center; }
    .pin-menu:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .app-name {
      width: 100%;
      min-height: 30px;
      display: -webkit-box;
      overflow: hidden;
      color: var(--ink);
      font-size: 11px;
      line-height: 1.35;
      font-weight: 680;
      overflow-wrap: anywhere;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .status {
      width: min(540px, 100%);
      margin: 22px auto;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 20px;
      color: var(--muted);
      background: var(--surface);
      text-align: center;
      box-shadow: var(--shadow);
      font-size: 13px;
      line-height: 1.6;
    }
    .status strong { display: block; margin-bottom: 5px; color: var(--ink); font-size: 15px; }
    .status code { color: var(--accent); font-size: 12px; }
    .empty-search { display: none; }
    .empty-search.visible { display: block; }

    footer {
      padding: 20px 18px max(24px, env(safe-area-inset-bottom));
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      letter-spacing: .15px;
    }
    footer span { color: var(--accent); font-weight: 800; }

    @keyframes reveal { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

    @media (min-width: 720px) {
      .top-shell { padding-left: 28px; padding-right: 28px; }
      main { padding: 40px 30px 64px; }
      .app-grid { grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 19px 15px; }
      .app-icon { width: 76px; height: 76px; border-radius: 23px; }
      .app-name { font-size: 12px; }
      .library-section { margin-bottom: 42px; }
    }

    @media (max-width: 420px) {
      .top-shell { padding-left: 13px; padding-right: 13px; }
      .brand-mark { width: 39px; height: 39px; flex-basis: 39px; border-radius: 14px; }
      .brand-name { font-size: 15px; }
      .icon-action { width: 39px; height: 39px; border-radius: 14px; }
      main { padding: 24px 12px 42px; }
      .intro { margin: 0 5px 24px; }
      .app-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 4px; }
      .app-tile { padding: 7px 2px 8px; border-radius: 16px; }
      .app-icon { width: min(17vw, 64px); height: min(17vw, 64px); border-radius: 19px; font-size: 19px; }
      .app-name { font-size: 10.5px; }
      .section-heading { margin-left: 5px; margin-right: 5px; }
    }

    /* Clear focus feedback for TV remotes and keyboards. */
    .app-tile:focus,
    .category-chip:focus,
    .icon-action:focus,
    .download-app-link:focus,
    #search-input:focus {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .category-chip:focus,
    .icon-action:focus,
    .download-app-link:focus {
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .app-tile:focus {
      background: var(--surface);
      border-color: var(--focus);
      transform: translateY(-3px);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="top-shell">
    <div class="topbar">
      <a class="brand" href="#top" aria-label="Desparenzo home">
        <span class="brand-mark" aria-hidden="true">D</span>
        <span class="brand-copy">
          <span class="brand-name">Desparenzo Inc.</span>
          <span class="brand-subtitle">Apps · Games · & More</span>
        </span>
      </a>
      <div class="top-actions">
        <button class="icon-action" id="search-toggle" type="button" aria-label="Search library" aria-expanded="false" title="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.5 4.5"></path></svg>
        </button>
        <button class="icon-action" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Change theme">
          <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 15.3A8.5 8.5 0 0 1 8.7 3.5 8.6 8.6 0 1 0 20.5 15.3Z"></path></svg>
        </button>
      </div>
    </div>
    <div class="search-row" id="search-row">
      <label class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.5 4.5"></path></svg>
        <input id="search-input" type="search" placeholder="Search apps and games..." autocomplete="off" spellcheck="false">
      </label>
    </div>
    <nav class="category-nav" id="category-nav" aria-label="Library categories"></nav>
  </div>

  <main id="top">
    <section class="intro" aria-label="Library introduction">
      <div>
        <p class="eyebrow">My Collection</p>
        <h1>Games & Apps</h1>
        <p class="intro-note">Everything I made, In one place.</p>
      </div>
      <div class="library-count" id="library-count">Loading library…</div>
    </section>

    <div class="search-results-bar" id="search-results-bar" hidden aria-live="polite">
      <span class="search-results-title" id="search-results-title">Search results</span>
      <span class="search-results-count" id="search-results-count"></span>
    </div>

    <section class="library-section pinned-section" id="pinned-section" hidden aria-label="Pinned apps">
      <div class="section-heading">
        <h2>Pinned</h2>
        <span class="section-count" id="pinned-count">0</span>
        <span class="section-rule"></span>
      </div>
      <div class="app-grid" id="pinned-grid"></div>
    </section>

    <div id="library-content" aria-live="polite">
      <div class="status"><strong>Loading your library</strong>Fetching the catalogue…</div>
    </div>
    <div class="status empty-search" id="empty-search"><strong>No matches found</strong>Try a different name or search term.</div>
  </main>

  <footer>Built with care by <span>Desparenzo</span></footer>

  <script>
    (() => {
      'use strict';

      const CATALOGUE_FILE = './library.txt';
      const MAIN_APK_FILE = './icons/Desparenzo.apk';
      const TV_APK_FILE = './icons/Desparenzo_Tv.apk';
      const HOLD_DURATION = 650;

      const content = document.getElementById('library-content');
      const nav = document.getElementById('category-nav');
      const countLabel = document.getElementById('library-count');
      const searchToggle = document.getElementById('search-toggle');
      const searchRow = document.getElementById('search-row');
      const searchInput = document.getElementById('search-input');
      const emptySearch = document.getElementById('empty-search');
      const searchResultsBar = document.getElementById('search-results-bar');
      const searchResultsTitle = document.getElementById('search-results-title');
      const searchResultsCount = document.getElementById('search-results-count');
      const pinnedSection = document.getElementById('pinned-section');
      const pinnedGrid = document.getElementById('pinned-grid');
      const pinnedCount = document.getElementById('pinned-count');
      const themeToggle = document.getElementById('theme-toggle');
      const themeIcon = document.getElementById('theme-icon');

      const PIN_STORAGE_KEY = 'desparenzo-pinned-apps-v1';

      let libraryCategories = [];
      let activeSearch = '';
      let pinnedUrls = loadPinnedUrls();
      let downloadLink = null;
      let activeCategoryIndex = 0;
      let okHoldState = null;

      const categoryGlyphs = {
        games: '🎮', game: '🎮', apps: '▦', app: '▦',
        utilities: '🛠', utility: '🛠', tools: '🧰'
      };

      const palettes = [
        ['#7867f4', '#4d8de8'], ['#f06e8b', '#cb5dd5'], ['#24a99a', '#3d83c9'],
        ['#ef9a45', '#e45e73'], ['#567ee8', '#855ddd'], ['#26a7c7', '#4f75dd'],
        ['#c26bd7', '#8063e8'], ['#43ad79', '#2994ac'], ['#e18c42', '#da5d9c']
      ];

      function loadPinnedUrls() {
        try {
          const saved = JSON.parse(localStorage.getItem(PIN_STORAGE_KEY) || '[]');
          return new Set(Array.isArray(saved) ? saved.filter(value => typeof value === 'string') : []);
        } catch (_) {
          return new Set();
        }
      }

      function savePinnedUrls() {
        try {
          localStorage.setItem(PIN_STORAGE_KEY, JSON.stringify([...pinnedUrls]));
        } catch (_) {
          /* Pins still work for this page session if browser storage is unavailable. */
        }
      }

      function hashText(value) {
        let hash = 0;
        for (let i = 0; i < value.length; i++) {
          hash = ((hash << 5) - hash + value.charCodeAt(i)) | 0;
        }
        return Math.abs(hash);
      }

      function safeHref(value) {
        try {
          const parsed = new URL(value, window.location.href);
          if (parsed.protocol === 'https:' || parsed.protocol === 'http:') return value;
        } catch (_) {}
        return null;
      }

      function iconPath(value) {
        const trimmed = value.trim();
        if (!trimmed) return '';
        if (/^(https?:)?\/\//i.test(trimmed) || trimmed.startsWith('data:')) return trimmed;
        if (trimmed.startsWith('/') || trimmed.startsWith('./') || trimmed.startsWith('../')) return trimmed;
        return 'icons/' + trimmed;
      }

      function parseCatalogue(raw) {
        const categories = [];
        let current = null;
        const lines = raw.replace(/^\uFEFF/, '').split(/\r?\n/);

        for (const originalLine of lines) {
          const line = originalLine.trim();
          if (!line || line.startsWith('#')) continue;

          const heading = line.match(/^\[(.+?)\]$/);
          if (heading) {
            current = { name: heading[1].trim(), items: [] };
            if (current.name) categories.push(current);
            continue;
          }

          if (!current) continue;
          const fields = line.split('|').map(part => part.trim());
          if (fields.length < 2) continue;

          const name = fields[0].replace(/^\d+\s*[.)-]\s*/, '').trim();
          const url = safeHref(fields[1]);
          const icon = fields[2] || '';
          if (!name || !url) continue;

          current.items.push({ name, url, icon });
        }

        return categories.filter(category => category.items.length > 0);
      }

      /* ---------- Download button: normal APK or TV APK ---------- */

      function isTvCategory(categoryName) {
        return /\btv\b/i.test(categoryName || '');
      }

      function updateDownloadButton(categoryName) {
        if (!downloadLink) return;

        const tvCategory = isTvCategory(categoryName);

        downloadLink.href = tvCategory ? TV_APK_FILE : MAIN_APK_FILE;
        downloadLink.download = tvCategory ? 'Desparenzo_Tv.apk' : 'Desparenzo.apk';
        downloadLink.textContent = tvCategory ? 'Download TV App' : 'Download the app';
      }

      function setActiveCategory(index) {
        if (!libraryCategories.length) return;

        activeCategoryIndex = Math.max(0, Math.min(index, libraryCategories.length - 1));

        nav.querySelectorAll('.category-chip').forEach((chip, chipIndex) => {
          chip.classList.toggle('active', chipIndex === activeCategoryIndex);
        });

        updateDownloadButton(libraryCategories[activeCategoryIndex].name);
      }

      /* ---------- Pin / Unpin menu ---------- */

      function updatePinMenu(button, item) {
        const isPinned = pinnedUrls.has(item.url);
        button.textContent = isPinned ? '★ Unpin' : '☆ Pin';
        button.setAttribute('aria-label', isPinned ? 'Unpin ' + item.name : 'Pin ' + item.name);
        button.setAttribute('aria-pressed', String(isPinned));
        button.title = isPinned ? 'Unpin this app' : 'Pin this app';
      }

      function closePinMenu(wrapper, restoreFocus = false) {
        if (!wrapper) return;

        const button = wrapper.querySelector('.pin-menu');
        if (button) button.hidden = true;

        wrapper.classList.remove('pin-menu-open');

        if (restoreFocus) {
          const tile = wrapper.querySelector('.app-tile');
          if (tile) tile.focus({ preventScroll: true });
        }
      }

      function closeAllPinMenus(restoreFocus = false) {
        const openMenus = [...document.querySelectorAll('.pin-menu:not([hidden])')];
        const wrappers = openMenus.map(button => button.closest('.app-tile-wrap')).filter(Boolean);

        wrappers.forEach(wrapper => closePinMenu(wrapper, false));

        if (restoreFocus && wrappers.length) {
          const tile = wrappers[0].querySelector('.app-tile');
          if (tile) tile.focus({ preventScroll: true });
        }
      }

      function showPinMenu(wrapper, item) {
        if (!wrapper) return;

        closeAllPinMenus(false);

        const button = wrapper.querySelector('.pin-menu');
        if (!button) return;

        updatePinMenu(button, item);
        button.hidden = false;
        wrapper.classList.add('pin-menu-open');
        button.focus({ preventScroll: true });
      }

      function togglePin(item) {
        if (pinnedUrls.has(item.url)) pinnedUrls.delete(item.url);
        else pinnedUrls.add(item.url);

        savePinnedUrls();
        renderPinned();

        document.querySelectorAll('.pin-menu').forEach(button => {
          if (button.dataset.url === item.url) updatePinMenu(button, item);
        });
      }

      /* ---------- Tile creation ---------- */

      function makeTile(item, category) {
        const wrapper = document.createElement('div');
        wrapper.className = 'app-tile-wrap';
        wrapper._desparenzoItem = item;

        const link = document.createElement('a');
        link.className = 'app-tile';
        link.href = item.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.setAttribute('aria-label', item.name + ', open in a new tab');

        const icon = document.createElement('span');
        icon.className = 'app-icon';

        const palette = palettes[hashText(item.name + category.name) % palettes.length];
        icon.style.setProperty('--icon-a', palette[0]);
        icon.style.setProperty('--icon-b', palette[1]);

        const iconUrl = iconPath(item.icon);

        if (iconUrl) {
          const image = document.createElement('img');
          image.src = iconUrl;
          image.alt = '';
          image.loading = 'lazy';
          image.decoding = 'async';
          image.onerror = () => {
            image.remove();
            icon.textContent = item.name.trim().slice(0, 1).toUpperCase();
          };
          icon.appendChild(image);
        } else {
          icon.textContent = item.name.trim().slice(0, 1).toUpperCase();
        }

        const label = document.createElement('span');
        label.className = 'app-name';
        label.textContent = item.name;
        link.append(icon, label);

        const pinMenu = document.createElement('button');
        pinMenu.type = 'button';
        pinMenu.className = 'pin-menu';
        pinMenu.hidden = true;
        pinMenu.dataset.url = item.url;
        updatePinMenu(pinMenu, item);

        pinMenu.addEventListener('click', event => {
          event.preventDefault();
          event.stopPropagation();

          closePinMenu(wrapper, false);
          togglePin(item);

          const originalTile = [...content.querySelectorAll('.app-tile')].find(tile => tile.href === link.href);
          if (originalTile) originalTile.focus({ preventScroll: true });
        });

        /* Mouse and touchscreen long press. */
        let pointerHoldTimer = null;

        function clearPointerHold() {
          if (pointerHoldTimer !== null) {
            window.clearTimeout(pointerHoldTimer);
            pointerHoldTimer = null;
          }
        }

        link.addEventListener('pointerdown', event => {
          if (event.pointerType === 'mouse' && event.button !== 0) return;

          clearPointerHold();

          pointerHoldTimer = window.setTimeout(() => {
            wrapper._suppressTileClickUntil = Date.now() + 1800;
            showPinMenu(wrapper, item);
          }, HOLD_DURATION);
        });

        link.addEventListener('pointerup', clearPointerHold);
        link.addEventListener('pointercancel', clearPointerHold);
        link.addEventListener('pointerleave', clearPointerHold);

        link.addEventListener('contextmenu', event => {
          event.preventDefault();
          wrapper._suppressTileClickUntil = Date.now() + 1800;
          showPinMenu(wrapper, item);
        });

        /* Stop the normal tile-opening click after a long press. */
        link.addEventListener('click', event => {
          if (Date.now() < (wrapper._suppressTileClickUntil || 0)) {
            event.preventDefault();
            event.stopPropagation();
            wrapper._suppressTileClickUntil = 0;
          }
        });

        wrapper.append(link, pinMenu);
        return wrapper;
      }

      function renderPinned() {
        const allItems = new Map();

        libraryCategories.forEach(category => {
          category.items.forEach(item => allItems.set(item.url, { item, category }));
        });

        const pinnedItems = [...pinnedUrls]
          .map(url => allItems.get(url))
          .filter(Boolean);

        pinnedGrid.replaceChildren();
        pinnedItems.forEach(({ item, category }) => {
          pinnedGrid.appendChild(makeTile(item, category));
        });

        pinnedCount.textContent = String(pinnedItems.length);
        pinnedSection.hidden = activeSearch.length > 0 || pinnedItems.length === 0;
      }

      /* ---------- Library rendering ---------- */

      function render(categories) {
        libraryCategories = categories;
        content.replaceChildren();
        nav.replaceChildren();

        let total = 0;

        categories.forEach((category, categoryIndex) => {
          total += category.items.length;

          const id = 'category-' + categoryIndex;
          const section = document.createElement('section');
          section.className = 'library-section';
          section.id = id;
          section.dataset.category = category.name.toLowerCase();

          const heading = document.createElement('div');
          heading.className = 'section-heading';

          const title = document.createElement('h2');
          title.textContent = category.name;

          const badge = document.createElement('span');
          badge.className = 'section-count';
          badge.textContent = category.items.length;

          const rule = document.createElement('span');
          rule.className = 'section-rule';

          heading.append(title, badge, rule);

          const grid = document.createElement('div');
          grid.className = 'app-grid';

          category.items.forEach(item => {
            grid.appendChild(makeTile(item, category));
          });

          section.append(heading, grid);
          content.appendChild(section);

          const chip = document.createElement('a');
          chip.className = 'category-chip' + (categoryIndex === 0 ? ' active' : '');
          chip.href = '#' + id;
          chip.textContent = category.name;

          chip.addEventListener('click', () => {
            setActiveCategory(categoryIndex);
          });

          nav.appendChild(chip);
        });

        downloadLink = document.createElement('a');
        downloadLink.className = 'download-app-link';
        downloadLink.href = MAIN_APK_FILE;
        downloadLink.download = 'Desparenzo.apk';
        downloadLink.textContent = 'Download the app';
        nav.appendChild(downloadLink);

        if (categories.length) setActiveCategory(0);

        countLabel.dataset.original = total + (total === 1 ? ' item' : ' items');
        countLabel.textContent = countLabel.dataset.original;

        if (!total) {
          content.innerHTML = '<div class="status"><strong>Your library is empty</strong>Add your first item to <code>library.txt</code> and refresh this page.</div>';
        }

        renderPinned();
        filterItems(searchInput.value);
      }

      function filterItems(query) {
        const normalized = query.trim().toLowerCase();
        activeSearch = normalized;

        let visibleTotal = 0;

        content.querySelectorAll('.library-section').forEach(section => {
          let sectionCount = 0;

          section.querySelectorAll('.app-tile-wrap').forEach(tile => {
            const name = tile.querySelector('.app-name').textContent.toLowerCase();
            const matches = name.includes(normalized);

            tile.hidden = !matches;
            if (matches) sectionCount++;
          });

          section.hidden = sectionCount === 0;
          visibleTotal += sectionCount;
        });

        const searching = normalized.length > 0;

        searchResultsBar.hidden = !searching;
        searchResultsTitle.textContent = searching ? 'Results for “' + query.trim() + '”' : '';
        searchResultsCount.textContent = searching
          ? visibleTotal + (visibleTotal === 1 ? ' result' : ' results')
          : '';

        emptySearch.classList.toggle('visible', searching && visibleTotal === 0);

        countLabel.textContent = searching
          ? visibleTotal + (visibleTotal === 1 ? ' match' : ' matches')
          : countLabel.dataset.original || countLabel.textContent;

        nav.querySelectorAll('.category-chip').forEach(chip => {
          const target = document.querySelector(chip.getAttribute('href'));
          chip.hidden = searching && (!target || target.hidden);
        });

        renderPinned();
      }

      async function loadCatalogue() {
        try {
          const response = await fetch(CATALOGUE_FILE, { cache: 'no-store' });

          if (!response.ok) {
            throw new Error('Could not load library.txt (HTTP ' + response.status + ').');
          }

          const raw = await response.text();
          const categories = parseCatalogue(raw);

          render(categories);
          countLabel.dataset.original = countLabel.textContent;
        } catch (error) {
          content.innerHTML = '<div class="status"><strong>Could not load the library catalogue</strong>' +
            'Make sure <code>library.txt</code> is uploaded beside <code>index.html</code> in your GitHub Pages repository.<br><br>' +
            '<span style="font-size:11px">' + String(error.message || error).replace(/[<>&]/g, '') + '</span></div>';

          countLabel.textContent = 'Catalogue unavailable';
        }
      }

      /* ---------- Search and theme ---------- */

      searchToggle.addEventListener('click', () => {
        const open = !searchRow.classList.contains('open');

        searchRow.classList.toggle('open', open);
        searchToggle.setAttribute('aria-expanded', String(open));

        if (open) {
          searchInput.focus();
        } else {
          searchInput.value = '';
          filterItems('');
        }
      });

      searchInput.addEventListener('input', () => filterItems(searchInput.value));

      document.addEventListener('keydown', event => {
        if (event.key === '/' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
          event.preventDefault();

          if (!searchRow.classList.contains('open')) searchToggle.click();
          else searchInput.focus();
        }

        if (event.key === 'Escape' && searchRow.classList.contains('open')) {
          searchToggle.click();
        }
      });

      function setTheme(theme) {
        document.documentElement.dataset.theme = theme;

        const dark = theme === 'dark';

        themeToggle.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');

        themeIcon.innerHTML = dark
          ? '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>'
          : '<path d="M20.5 15.3A8.5 8.5 0 0 1 8.7 3.5 8.6 8.6 0 1 0 20.5 15.3Z"></path>';

        try {
          localStorage.setItem('desparenzo-theme', theme);
        } catch (_) {}
      }

      let savedTheme = 'light';

      try {
        savedTheme = localStorage.getItem('desparenzo-theme') || 'light';
      } catch (_) {}

      setTheme(savedTheme === 'dark' ? 'dark' : 'light');

      themeToggle.addEventListener('click', () => {
        setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
      });

      /* ---------- TV remote / keyboard navigation ---------- */

      function isElementVisible(element) {
        if (!element || element.closest('[hidden]')) return false;
        if (!element.getClientRects().length) return false;
        return getComputedStyle(element).visibility !== 'hidden';
      }

      function getFocusableElements() {
        const selector = [
          '.app-tile',
          '.category-chip',
          '.icon-action',
          '.download-app-link',
          '#search-input',
          '.pin-menu'
        ].join(',');

        return [...document.querySelectorAll(selector)].filter(element => {
          if (element.disabled) return false;
          return isElementVisible(element);
        });
      }

      function focusElement(element) {
        if (!element || !isElementVisible(element)) return;

        element.focus({ preventScroll: true });

        element.scrollIntoView({
          behavior: 'smooth',
          block: 'nearest',
          inline: 'nearest'
        });
      }

      function moveSpatialFocus(direction) {
        const elements = getFocusableElements();

        if (!elements.length) return;

        const current = document.activeElement;

        if (!elements.includes(current)) {
          focusElement(elements[0]);
          return;
        }

        const currentRect = current.getBoundingClientRect();
        const currentX = currentRect.left + currentRect.width / 2;
        const currentY = currentRect.top + currentRect.height / 2;

        let bestElement = null;
        let bestScore = Infinity;

        elements.forEach(candidate => {
          if (candidate === current) return;

          const rect = candidate.getBoundingClientRect();
          const candidateX = rect.left + rect.width / 2;
          const candidateY = rect.top + rect.height / 2;

          const dx = candidateX - currentX;
          const dy = candidateY - currentY;

          let primary;
          let secondary;

          if (direction === 'right') {
            if (dx <= 2) return;
            primary = dx;
            secondary = Math.abs(dy);
          } else if (direction === 'left') {
            if (dx >= -2) return;
            primary = -dx;
            secondary = Math.abs(dy);
          } else if (direction === 'down') {
            if (dy <= 2) return;
            primary = dy;
            secondary = Math.abs(dx);
          } else {
            if (dy >= -2) return;
            primary = -dy;
            secondary = Math.abs(dx);
          }

          const score = primary + secondary * 1.8 + secondary * secondary * 0.006;

          if (score < bestScore) {
            bestScore = score;
            bestElement = candidate;
          }
        });

        /* Horizontal fallback keeps navigation moving at row edges. */
        if (!bestElement && (direction === 'left' || direction === 'right')) {
          const grid = current.closest('.app-grid');

          if (grid && current.classList.contains('app-tile')) {
            const rowTiles = [...grid.querySelectorAll('.app-tile')]
              .filter(isElementVisible);

            const index = rowTiles.indexOf(current);

            if (index !== -1) {
              const nextIndex = direction === 'right'
                ? (index + 1) % rowTiles.length
                : (index - 1 + rowTiles.length) % rowTiles.length;

              bestElement = rowTiles[nextIndex];
            }
          }
        }

        /* Final fallback: continue through the focusable elements. */
        if (!bestElement) {
          const index = elements.indexOf(current);
          const step = direction === 'right' || direction === 'down' ? 1 : -1;
          const nextIndex = (index + step + elements.length) % elements.length;
          bestElement = elements[nextIndex];
        }

        focusElement(bestElement);
      }

      function getVisibleLibraryTiles() {
        return [...content.querySelectorAll('.app-tile')].filter(isElementVisible);
      }

      function moveTileFocus(step) {
        const tiles = getVisibleLibraryTiles();

        if (!tiles.length) return;

        const currentIndex = tiles.indexOf(document.activeElement);

        if (currentIndex === -1) {
          focusElement(step > 0 ? tiles[0] : tiles[tiles.length - 1]);
          return;
        }

        const nextIndex = (currentIndex + step + tiles.length) % tiles.length;
        focusElement(tiles[nextIndex]);
      }

      function activateFocusedElement() {
        const active = document.activeElement;

        if (active && active !== document.body && typeof active.click === 'function') {
          active.click();
          return;
        }

        const firstTile = getVisibleLibraryTiles()[0];
        if (firstTile) firstTile.click();
      }

      function isOkKey(event) {
        return (
          ['Enter', ' ', 'NumpadEnter', 'Select', 'Accept'].includes(event.key) ||
          [13, 23, 66].includes(event.keyCode)
        );
      }

      function isBackKey(event) {
        const isTextField = ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName);

        if (isTextField && event.key === 'Backspace') return false;

        return (
          ['Escape', 'Backspace', 'BrowserBack', 'GoBack'].includes(event.key) ||
          event.keyCode === 4
        );
      }

      function handleBackAction() {
        const openMenu = document.querySelector('.pin-menu:not([hidden])');

        if (openMenu) {
          const wrapper = openMenu.closest('.app-tile-wrap');
          closePinMenu(wrapper, true);
          return;
        }

        if (searchRow.classList.contains('open')) {
          searchToggle.click();
          focusElement(searchToggle);
          return;
        }

        if (activeCategoryIndex !== 0 && libraryCategories.length) {
          setActiveCategory(0);

          const firstSection = document.getElementById('category-0');
          if (firstSection) {
            firstSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }

          const firstChip = nav.querySelector('.category-chip');
          if (firstChip) focusElement(firstChip);
          return;
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });

        const firstChip = nav.querySelector('.category-chip');
        focusElement(firstChip || searchToggle);
      }

      function handleMediaKey(event) {
        const key = event.key;
        const code = event.keyCode;

        const isNext =
          ['MediaTrackNext', 'MediaNextTrack'].includes(key) ||
          [176, 87].includes(code);

        const isPrevious =
          ['MediaTrackPrevious', 'MediaPreviousTrack'].includes(key) ||
          [177, 88].includes(code);

        const isPlayPause =
          ['MediaPlayPause', 'MediaPlay', 'MediaPause'].includes(key) ||
          [179, 85].includes(code);

        if (isNext) {
          event.preventDefault();
          moveTileFocus(1);
          return true;
        }

        if (isPrevious) {
          event.preventDefault();
          moveTileFocus(-1);
          return true;
        }

        if (isPlayPause) {
          event.preventDefault();
          activateFocusedElement();
          return true;
        }

        return false;
      }

      document.addEventListener('keydown', event => {
        const key = event.key;
        const code = event.keyCode;

        /* D-pad: standard browser keys and Android DPAD key codes. */
        const directions = {
          ArrowUp: 'up',
          ArrowDown: 'down',
          ArrowLeft: 'left',
          ArrowRight: 'right'
        };

        if (code === 19) directions[key] = 'up';
        if (code === 20) directions[key] = 'down';
        if (code === 21) directions[key] = 'left';
        if (code === 22) directions[key] = 'right';

        let direction = directions[key];

        if (!direction) {
          if (code === 19) direction = 'up';
          else if (code === 20) direction = 'down';
          else if (code === 21) direction = 'left';
          else if (code === 22) direction = 'right';
        }

        if (direction) {
          if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

          event.preventDefault();
          moveSpatialFocus(direction);
          return;
        }

        if (isBackKey(event)) {
          event.preventDefault();
          handleBackAction();
          return;
        }

        if (handleMediaKey(event)) return;

        /* Long-press OK on a focused app tile opens Pin / Unpin. */
        if (isOkKey(event)) {
          const tile = document.activeElement.closest
            ? document.activeElement.closest('.app-tile')
            : null;

          if (!tile) return;

          event.preventDefault();

          if (event.repeat || okHoldState) return;

          const wrapper = tile.closest('.app-tile-wrap');
          const item = wrapper ? wrapper._desparenzoItem : null;

          if (!wrapper || !item) return;

          const state = {
            tile,
            wrapper,
            item,
            key: event.key,
            keyCode: event.keyCode,
            longTriggered: false,
            timer: null
          };

          state.timer = window.setTimeout(() => {
            state.longTriggered = true;
            wrapper._suppressTileClickUntil = Date.now() + 1800;
            showPinMenu(wrapper, item);
          }, HOLD_DURATION);

          okHoldState = state;
        }
      });

      document.addEventListener('keyup', event => {
        if (!okHoldState) return;

        const state = okHoldState;

        const sameKey =
          event.key === state.key ||
          event.keyCode === state.keyCode ||
          event.keyCode === 0;

        if (!sameKey) return;

        window.clearTimeout(state.timer);
        okHoldState = null;

        if (!state.longTriggered) {
          state.tile.click();
        }
      });

      window.addEventListener('blur', () => {
        if (okHoldState) {
          window.clearTimeout(okHoldState.timer);
          okHoldState = null;
        }
      });

      /* Close an open Pin / Unpin menu when clicking somewhere else. */
      document.addEventListener('pointerdown', event => {
        if (
          !event.target.closest('.pin-menu') &&
          !event.target.closest('.app-tile-wrap.pin-menu-open')
        ) {
          closeAllPinMenus(false);
        }
      });

      loadCatalogue();
    })();
  </script>
</body>
</html>
